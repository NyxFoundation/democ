title: Nyxis — 認可に、証明を。
accent: "#5fd7d7"
transition: {duration: 0.4}
reading: {cps: 5.5, lead: 0.9, min: 2.4, max: 6}
scenes:
  - type: card
    name: 認可の不備
    style: hero
    text: "Webアプリの脆弱性リスク<br>第1位は、<em>認可の不備</em>"
    hold: 2.6

  - type: card
    name: 年間CVE
    style: danger
    text: "年間の脆弱性報告件数（2025年CVE）"
    number: 120
    count_ms: 700
    unit: "件"
    hold: 1.9

  - type: incident
    name: 抜けた2行
    timing: {settle: 1.0, request: 0.4, reveal: 0.5}
    text: "例）ブログアプリ<br>他ユーザーの下書きに<em>アクセスできてしまう。</em>"
    lang: js
    code: |
      app.get('/posts/:id', requireAuth,
        async (req, res) => {
          const post = await db.post.findUnique({
            where: { id: +req.params.id }
          })

          res.json(post)
        })
    missing: |
      if (!post.published && post.authorId !== req.user.id)
        return res.sendStatus(403)
    caption: "<b>たった2行のチェック漏れで発生しうる。レビュー・テスト・ファジングでは見逃しがち。</b>"
    hold: 2.7

  - type: card
    name: 簡単に
    style: hero
    text: "正しい認可を、<br><em>簡単に実装する。</em>"
    hold: 2.0

  - type: policy
    name: 書いてビルド
    timing: {line: 0.3, prepare: 0.45, build: 0.65, pass: 2.0, fail: 2.2}
    text: "数行の「認可ポリシー」を記述するだけ"
    code: |
      permit (
        principal is User,
        action == Action::"readPost",
        resource is Post
      ) when { resource.author == principal };
    schema: |
      @effect("update Post(title, body)")
      action "editPost" appliesTo {
        principal: [User], resource: [Post]
      };
    invalid: |
      @effect("update Post(title, {{bodyy}})")
      action "editPost" appliesTo {
        principal: [User], resource: [Post]
      };

  - type: kernel
    name: Leanカーネル
    text: '核となる技術は定理証明器<em>「Lean」</em>'
    root: Nyxis.Runtime.authorization_safety
    proposition: "認証済みユーザーの操作は、承認したポリシーの許可範囲を超えない。"
    duration: 18
    inspections:
      - title: "theorem authorization_safety"
        description: "発行される操作は、承認した<br>ポリシーの許可範囲内。"
      - title: "theorem trace_authorized"
        description: "リクエスト列が発行した操作にも、<br>正当な権限がある。"
        code: "Authorized app.schema app.policies i"
      - title: "structure Run (α : Type) where"
        code: |
          store : Store
          issued : List Issued
          external : List External
          result : α
      - title: "authorization_safety"
        description: "依存する項の型を確認。証明が成立。"
        code: "t : P"
    captions:
      - "記述したポリシーは定理証明器 <b>Lean</b>の値となり、認可安全性の命題に組み込まれます。"
      - "エラボレータが、型が命題となる<b>証明項</b> を組み立てます。"
      - "Leanカーネルは、依存する項が<b>要求された型を持つか</b>を検査します。"
      - "型の検査が通ることが<b>認可安全性の証明が成立することを意味します。</b>"

  - type: incident
    name: 同じURLを403に
    timing: {settle: 0.8, request: 0.35, reveal: 0.45}
    safe: true
    text: "証明された認可ポリシーは、<em>そのまま実行できる。</em>"
    lang: cedar
    code: |
      permit (
        principal is User,
        action == Action::"readPost",
        resource is Post
      ) when {
        resource.author == principal
      };
    caption: "<b>他人の下書きにはアクセス拒否。</b>"
    hold: 2.3

  - type: card
    name: Nyxis
    style: brand
    text: "<em>Nyxis</em>"
    sub: '認可を安全に実装する開発ツール<br><a href="https://github.com/NyxFoundation/nyxis">github.com/NyxFoundation/nyxis</a>'
    hold: 2.6
