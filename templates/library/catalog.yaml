    texture_asset: earth-daymap
  scene_type: study
  assets:
  - earth-daymap
- id: market-chart
  title: 重なるチャートから価格線へ
  category: finance
  renderer: html
  duration: 6.76
  tags:
  - finance
  takeaway: 重なるチャートから価格線へ
  mechanics:
  - 複数のチャートを奥行き方向へ重ねる。
  - 価格線へカメラを寄せる。
  - 発光する線から隣のチャートへ視線を移す。
  reference:
    brand: TradingView Advanced Charts
    page: https://www.tradingview.com/advanced-charts/
    asset: https://static.tradingview.com/static/bundles/advanced-charts-video.943087cf19f9f7adba9b.webm
    start: 0.15
    end: 6.9
    observed: 複数の金融チャートを奥行きと発光する折れ線でつなぐ。
  adaptation: Advanced Charts本体は非公開のため、TradingView公式のLightweight Chartsでチャートを描画。3枚のDOMパネル、紫の光、反射、カメラの接近を参考へ合わせる。Advanced
    Charts自体の複製ではなく、価格データは合成。
  parameters: {}
  scene_type: study
  source_implementation:
  - https://github.com/tradingview/lightweight-charts
  - https://www.tradingview.com/free-charting-libraries/
