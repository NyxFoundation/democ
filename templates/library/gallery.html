<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デモ素材ショーケース</title>
<style>
:root{color-scheme:dark;background:#101113;color:#ededeb;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{max-width:1680px;margin:0 auto;padding:42px 40px 80px}
header{margin-bottom:48px}h1{font-size:24px;font-weight:500;letter-spacing:-.04em;margin:0}
article{margin:0 0 64px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h2{font-size:20px;font-weight:500;margin:0;letter-spacing:-.025em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}
figcaption{display:flex;justify-content:space-between;font-size:14px;color:#85888d;margin-bottom:10px}figcaption a{color:inherit;text-decoration:none}figcaption a:hover{color:#ededeb;text-decoration:underline;text-underline-offset:4px}
video{display:block;width:100%;aspect-ratio:16/10;background:#08090a;border-radius:9px;object-fit:contain}
button{border:0;background:transparent;color:#c2c5c9;cursor:pointer;padding:10px;border-radius:50%;display:grid;place-items:center}
button:hover{background:#ffffff0c;color:#fff}button:focus-visible{outline:2px solid #a8bda5;outline-offset:3px}
button svg{width:20px;height:20px;fill:currentColor}.empty{aspect-ratio:16/10;background:#08090a;border-radius:9px}
@media(max-width:700px){body{padding:28px 16px 48px}header{margin-bottom:36px}.pair{gap:10px}article{margin-bottom:38px}h2{font-size:18px}figcaption{font-size:12px}video{border-radius:5px}}
@media(prefers-reduced-motion:reduce){video{scroll-behavior:auto}}
</style>
<header><h1>デモ素材ショーケース</h1></header>
<main id="showcase"></main>
<script>
const catalog=__CATALOG_JSON__;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const video=(path,label,poster)=>path?`<video controls muted loop playsinline preload="metadata" aria-label="${esc(label)}" ${poster?`poster="${esc(poster)}"`:''}><source src="${esc(path)}" type="video/mp4"></video>`:'<div class="empty"></div>';
document.getElementById('showcase').innerHTML=catalog.map(t=>`
<article id="${t.id}">
 <div class="heading"><h2>${esc(t.reference.brand)}</h2><button aria-label="2本を最初から再生"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg></button></div>
 <div class="pair">
  <figure><figcaption><a href="${esc(t.reference_clip||t.reference.asset)}" target="_blank" rel="noopener">参考 ↗</a><a href="${esc(t.reference.asset)}" target="_blank" rel="noopener">ソース ↗</a></figcaption>${video(t.reference_clip,t.reference.brand+' 参考')}</figure>
  <figure><figcaption><a href="${esc(t.render_clip||'#')}" target="_blank" rel="noopener">再現 ↗</a>${t.project_file?`<a href="${esc(t.project_file)}" ${t.renderer==='blender'?'download':'target="_blank" rel="noopener"'}>ソース ↗</a>`:''}</figcaption>${video(t.render_clip,t.reference.brand+' 再現',t.render_clip?.replace('.mp4','.jpg'))}</figure>
 </div>
</article>`).join('');
function start(article,exclusive=true){
 document.querySelectorAll('article').forEach(other=>{if(exclusive&&other!==article)other.querySelectorAll('video').forEach(v=>v.pause());});
 article.querySelectorAll('video').forEach(v=>{v.currentTime=0;v.play().catch(()=>{});});
}
document.querySelectorAll('article button').forEach(button=>button.addEventListener('click',()=>start(button.closest('article'))));
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
 const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
  if(entry.isIntersecting)start(entry.target,false);else entry.target.querySelectorAll('video').forEach(v=>v.pause());
 }),{threshold:.55});
 document.querySelectorAll('article').forEach(article=>observer.observe(article));
}
</script>
</html>
